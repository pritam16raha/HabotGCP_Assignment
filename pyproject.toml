# Author: Pritam Raha <rahapritam32@gmail.com>
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "backend/onboarding/migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "B", "A", "C4", "DTZ", "PIE", "RUF"]
ignore = [
  "S101", # Assertions are appropriate in tests and contract verification scripts.
]

[tool.ruff.lint.per-file-ignores]
"backend/config/settings.py" = ["S105"]
"scripts/build_submission_artifacts.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["backend/onboarding/tests", "build", ".venv"]

